<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">grill-me 功能概览</title>
  <desc id="desc">grill-me 将模糊输入通过分批追问转化为清晰产出，适用于工程、科研、决策和思辨四种场景。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { fill: #182033; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 0; }
      .subtitle { fill: #596276; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; font-weight: 400; letter-spacing: 0; }
      .card-title { fill: #182033; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0; }
      .card-text { fill: #455066; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 400; letter-spacing: 0; }
      .scene-title { fill: #182033; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 0; }
      .scene-text { fill: #596276; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: 0; }
      .small-title { fill: #182033; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0; }
      .small-text { fill: #596276; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 14px; font-weight: 400; letter-spacing: 0; }
      .main-card { fill: #ffffff; stroke: #d7dce8; stroke-width: 2; }
      .input-card { stroke: #6e7fdb; }
      .engine-card { stroke: #1f9d8a; }
      .output-card { stroke: #d9872b; }
      .scene-card { fill: #ffffff; stroke: #d7dce8; stroke-width: 1.5; }
      .mode-card { fill: #eef4ff; stroke: #c9d8ff; stroke-width: 1.3; }
      .dot-blue { fill: #6e7fdb; }
      .dot-green { fill: #1f9d8a; }
      .dot-orange { fill: #d9872b; }
      .dot-purple { fill: #9667d8; }
      .line { fill: none; stroke: #aeb6c8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .line-strong { fill: none; stroke: #1f9d8a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .chip { fill: #f4f6fb; stroke: #d7dce8; stroke-width: 1.2; }
      .shadow { filter: drop-shadow(0 14px 24px rgba(31, 41, 71, .10)); }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#1f9d8a"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" rx="0"/>
  <text class="title" x="600" y="76" text-anchor="middle">grill-me：动手之前，先把问题拷问清楚</text>
  <text class="subtitle" x="600" y="114" text-anchor="middle">把模糊想法收敛成可判断、可执行、可检验的结论</text>

  <g class="shadow">
    <rect class="scene-card" x="100" y="152" width="220" height="96" rx="16"/>
    <circle class="dot-blue" cx="132" cy="186" r="10"/>
    <text class="scene-title" x="158" y="193">工程</text>
    <text class="scene-text" x="132" y="222">方案、接口、验证、交付</text>

    <rect class="scene-card" x="350" y="152" width="220" height="96" rx="16"/>
    <circle class="dot-green" cx="382" cy="186" r="10"/>
    <text class="scene-title" x="408" y="193">科研</text>
    <text class="scene-text" x="382" y="222">问题、贡献、证据、边界</text>

    <rect class="scene-card" x="630" y="152" width="220" height="96" rx="16"/>
    <circle class="dot-orange" cx="662" cy="186" r="10"/>
    <text class="scene-title" x="688" y="193">决策</text>
    <text class="scene-text" x="662" y="222">选项、成本、风险、退出</text>

    <rect class="scene-card" x="880" y="152" width="220" height="96" rx="16"/>
    <circle class="dot-purple" cx="912" cy="186" r="10"/>
    <text class="scene-title" x="938" y="193">思辨</text>
    <text class="scene-text" x="912" y="222">概念、主张、反方、置信度</text>
  </g>

  <path class="line" d="M 210 248 C 210 286, 202 300, 236 320"/>
  <path class="line" d="M 460 248 C 460 286, 465 300, 478 320"/>
  <path class="line" d="M 740 248 C 740 286, 735 300, 722 320"/>
  <path class="line" d="M 990 248 C 990 286, 998 300, 964 320"/>

  <g class="shadow">
    <rect class="main-card input-card" x="70" y="320" width="300" height="220" rx="22"/>
    <text class="card-title" x="220" y="374" text-anchor="middle">模糊输入</text>
    <text class="card-text" x="220" y="418" text-anchor="middle">“想做个工具”</text>
    <text class="card-text" x="220" y="449" text-anchor="middle">“这个研究值不值得”</text>
    <text class="card-text" x="220" y="480" text-anchor="middle">“A 和 B 该选哪个”</text>
    <text class="card-text" x="220" y="511" text-anchor="middle">“我这个观点哪里不清楚”</text>

    <rect class="main-card engine-card" x="450" y="320" width="300" height="220" rx="22"/>
    <text class="card-title" x="600" y="374" text-anchor="middle">拷问引擎</text>
    <text class="card-text" x="600" y="418" text-anchor="middle">先查已有材料</text>
    <text class="card-text" x="600" y="449" text-anchor="middle">分批追问关键缺口</text>
    <text class="card-text" x="600" y="480" text-anchor="middle">给推荐答案与理由</text>
    <text class="card-text" x="600" y="511" text-anchor="middle">暴露假设、取舍和风险</text>

    <rect class="main-card output-card" x="830" y="320" width="300" height="220" rx="22"/>
    <text class="card-title" x="980" y="374" text-anchor="middle">清晰产出</text>
    <text class="card-text" x="980" y="418" text-anchor="middle">锁定方案</text>
    <text class="card-text" x="980" y="449" text-anchor="middle">研究问题图</text>
    <text class="card-text" x="980" y="480" text-anchor="middle">决策备忘</text>
    <text class="card-text" x="980" y="511" text-anchor="middle">论证图</text>
  </g>

  <path class="line-strong" d="M 370 430 H 436" marker-end="url(#arrow)"/>
  <path class="line-strong" d="M 750 430 H 816" marker-end="url(#arrow)"/>

  <g>
    <rect class="mode-card" x="246" y="578" width="220" height="58" rx="14"/>
    <text class="small-title" x="356" y="602" text-anchor="middle">材料核对</text>
    <text class="small-text" x="356" y="624" text-anchor="middle">能确认的不反问</text>

    <rect class="mode-card" x="490" y="578" width="220" height="58" rx="14"/>
    <text class="small-title" x="600" y="602" text-anchor="middle">活文档</text>
    <text class="small-text" x="600" y="624" text-anchor="middle">按需维护 CONTEXT / ADR</text>

    <rect class="mode-card" x="734" y="578" width="220" height="58" rx="14"/>
    <text class="small-title" x="844" y="602" text-anchor="middle">限次复审</text>
    <text class="small-text" x="844" y="624" text-anchor="middle">逆向检查高成本决定</text>
  </g>

  <g>
    <rect class="chip" x="162" y="674" width="150" height="44" rx="22"/>
    <text class="small-title" x="237" y="702" text-anchor="middle">目标明确</text>
    <rect class="chip" x="330" y="674" width="150" height="44" rx="22"/>
    <text class="small-title" x="405" y="702" text-anchor="middle">边界明确</text>
    <rect class="chip" x="498" y="674" width="150" height="44" rx="22"/>
    <text class="small-title" x="573" y="702" text-anchor="middle">取舍比较</text>
    <rect class="chip" x="666" y="674" width="150" height="44" rx="22"/>
    <text class="small-title" x="741" y="702" text-anchor="middle">风险暴露</text>
    <rect class="chip" x="834" y="674" width="204" height="44" rx="22"/>
    <text class="small-title" x="936" y="702" text-anchor="middle">下一步可验证</text>
  </g>
</svg>
